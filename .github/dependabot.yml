# Dependabot: PRs automáticos para mantener dependencias al día.
#
# cooldown de 14 días: no se proponen versiones con menos de 2 semanas publicadas.
# Los paquetes maliciosos suelen detectarse y retirarse en sus primeros días; esperar
# es la defensa más barata contra un ataque a la cadena de suministro.
# (Las actualizaciones de SEGURIDAD de Dependabot no esperan: llegan de inmediato.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Las Actions van fijadas por SHA (obligatorio en el repo);
    # Dependabot actualiza el SHA y mantiene el tag en el comentario.
    commit-message:
      prefix: "ci"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps"
    ignore:
      # webauthn4j-test debe ser la MISMA versión que webauthn4j-core, que trae
      # spring-security-webauthn. Se actualiza a mano junto con Spring Boot.
      - dependency-name: "com.webauthn4j:*"

  # Imagen de Postgres fijada por digest en compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps"

  # Frontend (Fase 5). Versiones exactas + lockfile; ignore-scripts en frontend/.npmrc.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # Bases del Dockerfile (node, JDK, JRE) fijadas por digest (Fase 7).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps"

  # Postgres de producción, fijado por digest.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps"
