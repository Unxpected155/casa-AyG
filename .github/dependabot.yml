# Dependabot: PRs automáticos para mantener dependencias al día.
# Se agrega cada ecosistema cuando exista su manifiesto:
#   docker → D4 (Dockerfile)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Las Actions van fijadas por SHA (obligatorio en el repo);
    # Dependabot actualiza el SHA y mantiene el tag en el comentario.
    commit-message:
      prefix: "ci"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  # Imagen de Postgres fijada por digest en compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  # Frontend (Fase 5). Versiones exactas + lockfile; ignore-scripts en frontend/.npmrc.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
