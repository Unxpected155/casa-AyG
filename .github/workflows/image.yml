# Imagen de producción (Fase 7, Docker D6 / ejercicio 6.6). En cada push a main:
#   build nativo ARM64 (el servidor de Oracle es ARM) → Trivy (falla con CVE críticos
#   corregibles) → push a GHCR → attestation de procedencia (SLSA) y SBOM firmados.
# Solo Actions de GitHub (la lista blanca del repo); Docker y Trivy se usan por CLI/imagen.
name: Imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/unxpected155/casa-ayg
  # Trivy fijado por digest (v0.76.1).
  TRIVY: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  image:
    name: Imagen ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push a GHCR
      id-token: write      # firma de las attestations (OIDC, sin llaves guardadas)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull -t "$IMAGE:sha-$GITHUB_SHA" .

      - name: Trivy (CVE críticos y altos con arreglo disponible)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            "$IMAGE:sha-$GITHUB_SHA"

      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --format cyclonedx --no-progress "$IMAGE:sha-$GITHUB_SHA" > sbom.cdx.json

      - name: Push a GHCR
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --quiet "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attestation del SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # Las attestations con push-to-registry usan la sesión de Docker: se cierra al final.
      - name: Cerrar sesión en GHCR
        if: always()
        run: docker logout ghcr.io
