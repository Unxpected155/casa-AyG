spring:
  application:
    name: casa-ayg
  # Los secretos se leen como archivos (un archivo por secreto), nunca de variables de entorno
  # ni de este YAML. En local: ./secrets/ en la raíz del repo, desde donde se ejecuta la app
  # (ver scripts/New-DevSecrets.ps1). En un contenedor: /run/secrets/.
  # ⚠️ La ruta no puede contener "..": configtree ignora como "ocultos" los archivos de rutas
  # con elementos que empiezan con ".." (para saltarse los "..data" de Kubernetes).
  config:
    import: "optional:configtree:${CASAAYG_SECRETS_DIR:./secrets/}"

  # La app en runtime usa casaayg_app: solo DML, nunca DDL (ver 01-roles.sh y V2).
  datasource:
    url: ${CASAAYG_DB_URL:jdbc:postgresql://localhost:5432/casaayg}
    username: casaayg_app
    password: ${db_app_password}

  # Flyway usa otro rol: casaayg_owner, dueño del esquema.
  flyway:
    user: casaayg_owner
    password: ${db_owner_password}
    schemas: casaayg
    default-schema: casaayg
    create-schemas: false
    # `flyway clean` borra TODO el esquema: deshabilitado siempre, en todo entorno.
    clean-disabled: true

  # Un JSON con campos que la API no espera se rechaza con 400 (mass assignment, Fase 4).
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # Cuerpos de petición pequeños: la API no recibe archivos.
  servlet:
    multipart:
      enabled: false

casaayg:
  security:
    # Producción: el nombre *.ts.net de Tailscale (ADR-003). Las passkeys quedan ligadas a él.
    rp-id: ${CASAAYG_RP_ID:localhost}
    origins: ${CASAAYG_ORIGINS:http://localhost:8080}
    session-absolute: 7d
    session-code: 10m
  exchange-rate:
    # Tipo de cambio de referencia del BCCR, publicado por Hacienda (sin token).
    enabled: ${CASAAYG_EXCHANGE_RATE_ENABLED:true}
    url: https://api.hacienda.go.cr/indicadores/tc/dolar

server:
  # El manifest de la PWA con su tipo correcto (si no, sale como octet-stream).
  mime-mappings:
    webmanifest: application/manifest+json
  # Límite del tamaño de las peticiones (Tomcat): nadie manda un JSON de 100 MB.
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 64KB
  servlet:
    session:
      # Inactividad. El máximo absoluto (7 días) lo aplica SessionTimeoutFilter.
      timeout: 30m
      cookie:
        # __Host-: el navegador exige Secure, Path=/ y prohíbe Domain (no la comparte un subdominio).
        name: __Host-casaayg
        http-only: true
        secure: true
        same-site: strict
        path: /
      tracking-modes: cookie
  # Los errores no revelan detalles internos (threat model 5.1-I).
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Actuator: solo health, sin detalles. env, beans, heapdump, etc. filtran información.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
